; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp-lcd-windows]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =    
	-D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_COLOR_DEPTH=16
    -D LV_TICK_CUSTOM=1
    -D CONFIG_ENV_PROD
	-DLV_CONF_INCLUDE_SIMPLE
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
    -DLV_MEM_CUSTOM=1 
	-DLV_MEM_SIZE=192*1024
	-Wno-deprecated-declarations
	-I src/
	-I include/
	-I lib/
    -I src/generated
	-I lib/lvgl/src/
	-I lib/CustomNetwork/
	-I lib/CustomTime/
	-I lib/CustomSerial/
	-I lib/CustomRTOS/
	-I lib/CustomDisplay/
	-I lib/CustomButton/
	-I lib/ESP32_Display_Panel/src/
	-I lib/ESP32_IO_Expander/src/
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git
    https://github.com/adafruit/Adafruit_SSD1306.git
	https://github.com/Lzw655/ESP32_IO_Expander.git
    esp-arduino-libs/esp-lib-utils@^0.2.0
	lvgl/lvgl@9.2.1
  	adafruit/Adafruit MLX90614 Library
  	adafruit/Adafruit BusIO
	adafruit/Adafruit MPU6050@^2.2.0
    adafruit/Adafruit Unified Sensor@^1.1.14
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.1
    ; knolleary/PubSubClient@^2.8
	; WiFiManager
monitor_filters = time, log2file